name: Android APK Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag'
        required: true
        default: 'v1.18.0'

permissions:
  contents: write

jobs:
  build:
    name: Build APK and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK topilmadi!"
            exit 1
          fi

          echo "APK topildi: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Set release tag
        id: release
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          cp "${{ steps.apk.outputs.path }}" \
             "O'zbek-Hayot-${{ steps.release.outputs.tag }}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: O'zbek Hayot ${{ steps.release.outputs.tag }}
          files: "O'zbek-Hayot-${{ steps.release.outputs.tag }}.apk"
          generate_release_notes: true
