apply plugin: 'com.android.application'

android {
    namespace "com.asadbekai.simulator"
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.asadbekai.simulator"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 18
        versionName "1.18.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def storePath = System.getenv("ANDROID_RELEASE_STORE_FILE")
            def storePass = System.getenv("ANDROID_RELEASE_STORE_PASSWORD")
            def keyAlias = System.getenv("ANDROID_RELEASE_KEY_ALIAS")
            def keyPass = System.getenv("ANDROID_RELEASE_KEY_PASSWORD")
            if (storePath && storePass && keyAlias && keyPass) {
                storeFile file(storePath)
                storePassword storePass
                setKeyAlias(keyAlias)
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            if (System.getenv("ANDROID_RELEASE_STORE_FILE") &&
                System.getenv("ANDROID_RELEASE_STORE_PASSWORD") &&
                System.getenv("ANDROID_RELEASE_KEY_ALIAS") &&
                System.getenv("ANDROID_RELEASE_KEY_PASSWORD")) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException("Production release signing sozlanmagan. ANDROID_RELEASE_STORE_FILE, ANDROID_RELEASE_STORE_PASSWORD, ANDROID_RELEASE_KEY_ALIAS va ANDROID_RELEASE_KEY_PASSWORD environment variablelarini belgilang.")
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
